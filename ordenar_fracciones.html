<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Ordenar Números</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        .game-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .cards-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            width: 60px;
            height: 90px;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: move;
            user-select: none;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .stats {
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Ordena los números</h1>
        <div class="controls">
            <button id="mode-toggle">Modo: Intercambiar</button>
            <button id="restart">Reiniciar</button>
        </div>
        <div class="cards-container" id="cards-container"></div>
        <div class="stats">
            <p>Tiempo: <span id="time">00:00</span></p>
            <p>Movimientos: <span id="moves">0</span></p>
        </div>
    </div>

    <script>
        const cardsContainer = document.getElementById('cards-container');
        const modeToggle = document.getElementById('mode-toggle');
        const restartButton = document.getElementById('restart');
        const timeDisplay = document.getElementById('time');
        const movesDisplay = document.getElementById('moves');

        let cards = [];
        let isExchangeMode = true;
        let moves = 0;
        let startTime;
        let timerInterval;

        function initGame() {
            cards = Array.from({length: 8}, (_, i) => i + 1)
                .sort(() => Math.random() - 0.5);
            renderCards();
            moves = 0;
            movesDisplay.textContent = moves;
            startTimer();
        }

        function renderCards() {
            cardsContainer.innerHTML = '';
            cards.forEach((num, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = num;
                card.draggable = true;
                card.addEventListener('dragstart', dragStart);
                card.addEventListener('dragover', dragOver);
                card.addEventListener('drop', drop);
                cardsContainer.appendChild(card);
            });
        }

        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.textContent);
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function drop(e) {
            e.preventDefault();
            const draggedNum = parseInt(e.dataTransfer.getData('text'));
            const targetNum = parseInt(e.target.textContent);
            const draggedIndex = cards.indexOf(draggedNum);
            const targetIndex = cards.indexOf(targetNum);

            if (isExchangeMode) {
                [cards[draggedIndex], cards[targetIndex]] = [cards[targetIndex], cards[draggedIndex]];
            } else {
                cards.splice(draggedIndex, 1);
                cards.splice(targetIndex, 0, draggedNum);
            }

            moves++;
            movesDisplay.textContent = moves;
            renderCards();
            checkWin();
        }

        function checkWin() {
            if (cards.every((num, index) => num === index + 1)) {
                clearInterval(timerInterval);
                alert(`¡Felicidades! Has ordenado los números en ${timeDisplay.textContent} y ${moves} movimientos.`);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const seconds = (elapsedTime % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${minutes}:${seconds}`;
        }

        modeToggle.addEventListener('click', () => {
            isExchangeMode = !isExchangeMode;
            modeToggle.textContent = `Modo: ${isExchangeMode ? 'Intercambiar' : 'Desplazar'}`;
        });

        restartButton.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
