<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuentra el Número Mínimo</title>
    <style>
        .game-container {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .matrix-container {
            display: inline-grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            margin-bottom: 20px;
        }
        .cell {
            width: 40px;
            height: 40px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .rotated {
            transform: rotate(180deg);
        }
        #timer, #score {
            margin-bottom: 10px;
        }
        .correct {
            background-color: #90EE90;
        }
        .incorrect {
            background-color: #FFB6C1;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Encuentra el Número Mínimo</h1>
        <p>Haga click en el número mínimo lo más rápido posible!!</p>
        <div id="matrixContainer" class="matrix-container"></div>
        <div id="timer">Tiempo: 0.0s</div>
        <div id="score"></div>
        <button id="startButton">Iniciar</button>
        <p>Elaborado por: Jorge Victorino</p>
    </div>

    <script>
        const matrixContainer = document.getElementById('matrixContainer');
        const timerElement = document.getElementById('timer');
        const scoreElement = document.getElementById('score');
        const startButton = document.getElementById('startButton');

        let matrix = [];
        let timer;
        let startTime;
        let gameActive = false;

        function createMatrix() {
            matrix = [];
            matrixContainer.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const number = Math.floor(Math.random() * 199) - 99;
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = number;
                cell.addEventListener('click', () => checkNumber(i));

                // Rotar aleatoriamente algunos números
                if (Math.random() < 0.3) {
                    cell.classList.add('rotated');
                }

                matrixContainer.appendChild(cell);
                matrix.push(number);
            }
        }

        function startGame() {
            if (gameActive) return;
            gameActive = true;
            createMatrix();
            startTime = Date.now();
            timer = setInterval(updateTimer, 100);
            startButton.textContent = 'Reiniciar';
            scoreElement.textContent = '';
        }

        function updateTimer() {
            const elapsedTime = (Date.now() - startTime) / 1000;
            timerElement.textContent = `Tiempo: ${elapsedTime.toFixed(1)}s`;
        }

        function checkNumber(index) {
            if (!gameActive) return;
            const minNumber = Math.min(...matrix);
            const cells = document.querySelectorAll('.cell');

            if (matrix[index] === minNumber) {
                cells[index].classList.add('correct');
                gameActive = false;
                clearInterval(timer);
                setTimeout(() => {
                    alert('¡Correcto! Has encontrado el número mínimo.');
                    startButton.textContent = 'Nuevo juego';
                }, 100);
            } else {
                cells[index].classList.add('incorrect');
                const correctIndex = matrix.indexOf(minNumber);
                cells[correctIndex].classList.add('correct');
                gameActive = false;
                clearInterval(timer);
                setTimeout(() => {
                    alert('Incorrecto. Inténtalo de nuevo.');
                    startButton.textContent = 'Nuevo juego';
                }, 100);
            }
        }

        startButton.addEventListener('click', startGame);
    </script>
</body>
</html>
